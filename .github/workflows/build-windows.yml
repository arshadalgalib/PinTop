name: Build PinTop (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'PinTop.cpp'
      - 'PinTopHook.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure x64 Release build
        run: cmake -S . -B build -A x64

      - name: Compile PinTop and system-menu hook
        run: cmake --build build --config Release --parallel

      - name: Stage application files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/PinTop.exe dist/PinTop.exe
          Copy-Item build/Release/PinTopHook.dll dist/PinTopHook.dll
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/* -DestinationPath PinTop-windows-x64.zip -Force

      - name: Upload PinTop artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinTop-windows-x64
          path: PinTop-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
